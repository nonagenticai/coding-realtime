[project]
name = "coding-realtime"
version = "1.0.0"
license = { text = "Apache-2.0" }
description = "Real-time Service - WebSocket connections, broadcast, metrics, health monitoring"
authors = [{name = "Nonagentic", email = "dev@nonagentic.ai"}]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.0",
    "redis>=7.1.0",
    "structlog>=24.4.0",
    # >=1.5.1 pulls pydantic-ai>=1.101 (clears CVE-2026-46678; pydantic-ai 1.94 fails pip-audit).
    # >=1.10.0: AuthMiddleware finally reads `Authorization: Bearer <license>` and
    # verifies it by introspection. Required, not optional, on THIS service: it runs
    # with TRUST_TENANT_HEADER=false (gitops #2426), and at <=1.9.0 the middleware
    # never looked at the Bearer at all — the header block yielded nothing and control
    # fell straight through to the trusted-CIDR bypass (TRUSTED_CIDRS="") and a 401.
    # Measured 2026-08-05 before this bump: a licence the licences service reports
    # active:true got 401 on /api/stats. Do NOT lower this floor.
    #
    # >=1.10.1 (not 1.10.0): 1.10.0's `_user_from_license` wrapped only the HTTP
    # call, leaving the `User(...)` build outside the try — so an introspection
    # body with a non-string `tenant_id` raised a pydantic ValidationError straight
    # out of `dispatch` as a **500**, handing whoever influences that response a
    # liveness lever, and a 500 is not a rejection anybody audits. 1.10.1 moves the
    # whole parse inside the guard, rejects malformed/whitespace-only tenant and
    # subject ids, and adds a short negative cache so a rejected caller is not a
    # 1:1 amplifier into `licenses`. Ship 1.10.1; 1.10.0 is published but superseded.
    # >=1.12.0: adds `auth.websocket.resolve_websocket_identity`. AuthMiddleware is
    # a BaseHTTPMiddleware and Starlette never invokes it on a `websocket` scope, so
    # no middleware and no config flip can protect a WS route — each handler must
    # resolve identity itself. With TRUST_TENANT_HEADER=false fleet-wide, this
    # service's WS routes were among the last places any pod could assert any
    # tenant and be believed. See src/utils/websocket_utils.resolve_ws_tenant.
    # >=1.15.0: closes the uncredentialed WS handshake. Through 1.14.0
    # `WebSocketIdentity.should_close` was True only for Outcome.REFUSED, so a
    # handshake with NO Authorization at all fell through and this service
    # served `subscription_established` on a forged X-Tenant-Id (reproduced from
    # inside the pod on /api/broadcast/subscribe). 1.15.0 makes should_close True
    # for NO_CREDENTIAL too. Do NOT lower this floor: at <=1.14.0 the fallback
    # branch in resolve_ws_tenant is reachable again and the hole reopens.
    # >=1.19.0: clients.CodingWorkspacesClient — the canonical typed workspace
    # client that src/clients/coding_containers.py now delegates to instead of
    # hand-building /api/workspaces URLs and query-param names over raw httpx.
    # This floor is LOAD-BEARING, not cosmetic: 1.16.0 has no coding_workspaces
    # module at all, so the import fails outright below it. It is also the fix
    # for a whole bug class — this service shipped `params={"file_path": ...}`
    # to a route whose parameter is `path`, and FastAPI answered 200 with
    # `content: None` for every read instead of erroring.
    "coding-client>=1.19.5",
    # Explicit floor for PYSEC-2026-161 (transitive via fastapi); 1.0.0 is vulnerable.
    "starlette>=1.3.1",
    "aiosqlite>=0.20.0",
    # WebSocket-specific
    "websockets>=12.0",
    # OpenTelemetry
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.53b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.17.4",
    "ty==0.0.39",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.17.4",
    "detect-secrets",
    "pip-audit>=2.10.0",
    "ty==0.0.39",
    # PYSEC-2026-3721: pip 26.1.2 is vulnerable (transitive via pip-audit -> pip-api -> pip); explicit floor so a re-lock cannot regress
    "pip>=26.2",
]

[tool.uv]
# Security constraints for transitive packages this service never imports directly,
# kept at/above the patched release via a uv constraint (not a direct dependency):
#  - pyasn1 0.6.3 (via google-auth -> pyasn1-modules): PYSEC-2026-3455/3456/3457, fix 0.6.4
#  - aiohttp 3.14.1: CVE-2026-59881 / -69243 / -69244, fix 3.14.3
#  - cryptography 49.0.0: CVE-2026-69247, fix 50.0.0
# The aiohttp/cryptography CVEs are freshly-published 2026 advisories, pre-existing
# on main (last main run 2026-07-30) — the pip-audit gate went red fleet-wide, not
# because of the coding-client bump in this PR.
constraint-dependencies = [
    "pyasn1>=0.6.5",
    "aiohttp>=3.14.4",
    "cryptography>=50.0.0",
]

[tool.uv.sources]
coding-client = { git = "https://github.com/nonagenticai/coding-client", rev = "f7f25b4e81fe4390586108a7a731608dacf462fd" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N818"]

[tool.bandit]
# Accepted-risk findings, confirmed by reading the code (honoured by the python-service
# archetype via `bandit -c pyproject.toml`):
#   B608 (7×, services/metrics_service.py) — the f-string SQL only interpolates a
#         where_clause built solely from fixed literals ("WHERE created_at >= ?",
#         " AND user_id = ?"); all user values flow through the `?` placeholders in the
#         params list passed to db.execute(). Genuinely parameterized, not injectable.
#   B108 (1×, utils/parameter_validation.py) — "/tmp/test" is a string constant in the
#         TEST_PATHS schemathesis reject-list, not a temp-file creation.
skips = ["B108", "B608"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
