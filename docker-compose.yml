services:
  coding-realtime:
    build:
      context: ..
      dockerfile: coding-realtime/Dockerfile
    container_name: coding-realtime

    environment:
      SERVICE_NAME: coding-realtime
      VERSION: 1.0.0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      PORT: 8694
      DEFAULT_TENANT_ID: n8n-dev
      ENABLE_AUTH: "true"
      ENABLE_DOCS: "true"

      # Database
      DATABASE_URL: postgresql+psycopg://coding:${POSTGRES_PASSWORD:-coding}@postgres:5432/code_graph
      PGBOUNCER_URL: postgresql+psycopg://coding:${POSTGRES_PASSWORD:-coding}@pgbouncer:6432/code_graph

      # Redis
      REDIS_URL: redis://code-graph-redis:6379/0

      # OpenTelemetry
      OTLP_TRACES_ENDPOINT: http://grafana-agent:4318/v1/traces
      OTEL_SERVICE_NAME: coding-realtime
      OTEL_SDK_DISABLED: "false"

    ports:
      - "0.0.0.0:8694:8694"

    networks:
      - workflow-system-network

    restart: unless-stopped


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8694/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  workflow-system-network:
    driver: bridge
